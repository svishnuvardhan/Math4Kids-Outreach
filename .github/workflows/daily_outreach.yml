name: Daily School Outreach

on:
  schedule:
    # Runs at 19:20 UTC (3:20 PM local Mississauga time)
    - cron: '20 19 * * *'
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  outreach:
    runs-on: ubuntu-latest
    # Required for the Create Pull Request action to work
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas

      - name: Execute Outreach Script
        env:
          EMAIL_1: ${{ secrets.EMAIL_1 }}
          PASS_1: ${{ secrets.PASS_1 }}
        run: python outreach_script.py

      # This creates a Pull Request specifically for the log updates
      - name: Create Pull Request for Logs
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update outreach logs [skip ci]"
          committer: Outreach-Bot <outreach@github-actions.com>
          author: Outreach-Bot <outreach@github-actions.com>
          signoff: false
          branch: logs/update
          delete-branch: true
          title: "🤖 Update outreach logs"
          body: "Automated log update from outreach workflow. Review the schools contacted today."
          labels: |
            automated-update
            logs
        if: ${{ always() }} # Ensures the PR is created even if some emails fail
