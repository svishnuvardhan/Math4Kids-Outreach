name: Multi-Account Outreach

on:
  schedule:
    - cron: '20 19 * * *' # 5:00 AM Mississauga time
  workflow_dispatch:

jobs:
  outreach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas

      - name: Execute Script
        env:
          EMAIL_1: ${{ secrets.EMAIL_1 }}
          PASS_1: ${{ secrets.PASS_1 }}
        run: python outreach_script.py

      - name: Commit Progress Log
        run: |
          git config --global user.name "Outreach-Bot"
          git config --global user.email "outreach@github-actions.com"
          git add sent_emails_log.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "Update logs [skip ci]"
          git push
